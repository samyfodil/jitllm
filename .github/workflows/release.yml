name: release

# A v* tag builds a DRAFT release with one archive per program -- the CLI
# (jitllm), the server (jitllmd), the desktop app and the terminal app -- for
# Linux, macOS and Windows on amd64 and arm64, runs the shipped archives on
# three hosts, and publishes the draft only if all three decoded a real model
# correctly. The container image is pushed to ghcr.io under the
# version with the draft, and tagged latest only when the draft is published.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.x"

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release and upload to it
      packages: write # push the version's image to ghcr.io (dockers_v2)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog is built from the commits since the last tag
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            server/go.sum
            common/go.sum
            ui/go.sum
            tui/go.sum
      # The image's arm64 half runs its apt step under QEMU; the binaries in
      # it are the ones goreleaser cross-built above it.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ contains(github.ref_name, '-draft') && 'release --clean --skip=docker' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Unset, the darwin binaries ship with the linker's ad-hoc
          # signature; set, they are signed with the hardened runtime plus the
          # JIT entitlements and notarized. See .goreleaser.yaml.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7

  # The desktop app's bundle is signed on a Mac. goreleaser signs and
  # notarizes the bare darwin binaries on Linux, but it assembles jitllm.app
  # before that, so the bundle carried an unsigned binary and no signature of
  # its own. Here each darwin desktop archive is unpacked, its bundle signed --
  # the binary inside first, then the bundle -- with the hardened runtime and
  # the JIT entitlements, by the Developer ID when MACOS_SIGN_P12 is set and
  # ad-hoc when it is not, notarized and stapled when the notary key is set,
  # and the archive repacked. Its line in checksums.txt, the release's assets
  # and the dist artifact the smoke runs read are all replaced, so what is
  # tested is what is shipped.
  #
  # The bundle also carries the CLI and the server, from their own darwin
  # archives, under Contents/Resources/bin (signed before the bundle that
  # seals them): the app links them into PATH and the Homebrew cask links them
  # from there. The signed bundle then goes into jitllm_<version>_darwin_<arch>.dmg
  # (packaging/macos/dmg.sh), itself signed, notarized and stapled under the
  # same conditions, and, zipped by ditto, into jitllm_<version>_darwin_<arch>.app.zip.
  macos-app:
    needs: goreleaser
    runs-on: macos-15
    permissions:
      contents: write # replace the draft's darwin desktop archives
    env:
      # A secret cannot be read in a step's if; this can.
      HAS_SIGN: ${{ secrets.MACOS_SIGN_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/release
            packaging/macos
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: keychain
        if: env.HAS_SIGN == 'true'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/sign.keychain-db"
          kpw=$(uuidgen)
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$kpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kpw" "$kc"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$MACOS_SIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpw" "$kc"
          # The search list is one name per word: unquoted on purpose.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"
          id=$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          if [ -z "$id" ]; then
            # A self-signed certificate is not a trusted identity, so -v does
            # not list it; codesign takes it by its hash. Gatekeeper still
            # treats the app as from an unidentified developer.
            id=$(security find-identity -p codesigning "$kc" | awk '/^ *[0-9]+\)/{print $2; exit}')
          fi
          test -n "$id"
          echo "SIGN_ID=$id" >> "$GITHUB_ENV"
      - name: sign, notarize and repack the bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail
          ent="$PWD/.github/release/entitlements.plist"
          dmgsh="$PWD/packaging/macos/dmg.sh"
          id="${SIGN_ID:--}"
          ts=""
          if [ "$id" != "-" ]; then ts=--timestamp; fi
          notarize() { # file: submit to the notary service and wait
            key="$RUNNER_TEMP/notary.p8"
            printf '%s' "$MACOS_NOTARY_KEY" > "$key"
            xcrun notarytool submit "$1" --key "$key" \
              --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
            rm -f "$key"
          }
          resum() { # asset: replace its checksums.txt line and upload it
            sum=$(shasum -a 256 "$1" | awk '{print $1}')
            grep -v " $1\$" checksums.txt > checksums.new || true
            echo "$sum  $1" >> checksums.new
            mv checksums.new checksums.txt
            gh release upload "$GITHUB_REF_NAME" "$1" --clobber --repo "$GITHUB_REPOSITORY"
          }
          cd dist
          for archive in jitllm-desktop_*_darwin_*.tar.gz; do
            # jitllm-desktop_<version>_darwin_<arch>.tar.gz
            rest=${archive#jitllm-desktop_}
            ver=${rest%%_darwin_*}
            arch=${rest##*_darwin_}
            arch=${arch%.tar.gz}
            work=$(mktemp -d)
            tar -xzf "$archive" -C "$work"
            app="$work/jitllm.app"
            test -d "$app"
            mkdir -p "$app/Contents/Resources/bin"
            for prog in jitllm jitllmd; do
              tar -xzf "${prog}_${ver}_darwin_${arch}.tar.gz" -C "$app/Contents/Resources/bin" "$prog"
            done
            codesign --force --options runtime $ts --entitlements "$ent" -s "$id" "$app/Contents/Resources/bin/"*
            codesign --force --options runtime $ts --entitlements "$ent" -s "$id" "$app/Contents/MacOS/"*
            codesign --force --options runtime $ts --entitlements "$ent" -s "$id" "$app"
            codesign --verify --strict --deep --verbose=2 "$app"
            "$app/Contents/Resources/bin/jitllm" version
            if [ "$id" != "-" ] && [ -n "$MACOS_NOTARY_KEY" ]; then
              ditto -c -k --keepParent "$app" "$work/app.zip"
              notarize "$work/app.zip"
              xcrun stapler staple "$app"
              rm -f "$work/app.zip"
            fi
            # The bundle on its own, for those who skip the image: ditto
            # keeps the signature, the stapled ticket and the links, which
            # zip(1) does not.
            appzip="jitllm_${ver}_darwin_${arch}.app.zip"
            ditto -c -k --keepParent "$app" "$appzip"
            resum "$appzip"
            dmg="jitllm_${ver}_darwin_${arch}.dmg"
            "$dmgsh" "$app" "$dmg"
            if [ "$id" != "-" ]; then
              codesign --force $ts -s "$id" "$dmg"
              if [ -n "$MACOS_NOTARY_KEY" ]; then
                notarize "$dmg"
                xcrun stapler staple "$dmg"
              fi
            fi
            resum "$dmg"
            # The archive's other entries (the bare binary, README, LICENSE)
            # go back as they were; only the bundle changed.
            (cd "$work" && tar -czf "$OLDPWD/$archive" -- *)
            resum "$archive"
            rm -rf "$work"
          done
          gh release upload "$GITHUB_REF_NAME" checksums.txt --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          overwrite: true
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.app.zip
            dist/checksums.txt
          retention-days: 7

  # The Windows setup, jitllm-setup_<version>_windows_<arch>.exe, one per
  # architecture: a per-user NSIS installer of the CLI, the server and the
  # desktop app from the release's own zips (packaging/windows). makensis runs
  # here on Linux. With WINDOWS_SIGN_PFX (the certificate's .pfx, base64) and
  # WINDOWS_SIGN_PASSWORD set, the three programs, the uninstaller and the
  # setup are Authenticode-signed; without them the setup is unsigned and
  # SmartScreen warns on first run. Beside each setup, the portable desktop
  # app, jitllm-desktop_<version>_windows_<arch>.exe: the GUI alone, signed
  # the same way, which runs from wherever it is saved and installs nothing.
  # After macos-app, which rewrites the same checksums.txt.
  windows-setup:
    needs: macos-app
    runs-on: ubuntu-24.04
    permissions:
      contents: write # add the setups to the draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ui/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis osslsigncode
      - name: build and sign the setups
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$PFX" ]; then
            printf '%s' "$PFX" | base64 --decode > "$RUNNER_TEMP/sign.pfx"
            export WINDOWS_SIGN_PFX="$RUNNER_TEMP/sign.pfx"
          fi
          ver=${GITHUB_REF_NAME#v}
          resum() { # asset in dist: replace its checksums.txt line and upload it
            (cd dist && sum=$(sha256sum "$1" | cut -d' ' -f1) &&
              { grep -v " $1\$" checksums.txt || true; echo "$sum  $1"; } > checksums.new &&
              mv checksums.new checksums.txt)
            gh release upload "$GITHUB_REF_NAME" "dist/$1" --clobber --repo "$GITHUB_REPOSITORY"
          }
          for arch in amd64 arm64; do
            setup="jitllm-setup_${ver}_windows_${arch}.exe"
            packaging/windows/build.sh "$ver" "$arch" dist "dist/$setup"
            resum "$setup"
            portable="jitllm-desktop_${ver}_windows_${arch}.exe"
            unzip -q -o -p "dist/jitllm-desktop_${ver}_windows_${arch}.zip" jitllm-desktop.exe > "dist/$portable"
            if [ -n "$PFX" ]; then packaging/windows/sign.sh "dist/$portable"; fi
            resum "$portable"
          done
          rm -f "$RUNNER_TEMP/sign.pfx"
          gh release upload "$GITHUB_REF_NAME" dist/checksums.txt --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          overwrite: true
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.app.zip
            dist/*.exe
            dist/checksums.txt
          retention-days: 7

  # Run what was shipped, not what was built in CI: the archive, its checksum,
  # and on macOS its actual signature. `hardware` alone never executes a
  # generated kernel, so each host also converts and decodes a 360M model and
  # checks the answer, because a rate or an exit code is not evidence that the
  # engine computed the model.
  smoke:
    needs: [goreleaser, macos-app, windows-setup]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15
            target: darwin_arm64
          - runner: windows-2025
            target: windows_amd64
          - runner: windows-11-arm
            target: windows_arm64
    runs-on: ${{ matrix.runner }}
    env:
      MODELS: ${{ github.workspace }}/models
    # Git Bash on Windows, so one script serves every host.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Every program ships as its own archive: the CLI, the server and the
      # two apps. Each is checked against checksums.txt and unpacked; the CLI
      # is the one that then decodes a model.
      - name: verify checksums and unpack
        run: |
          set -euo pipefail
          cd dist
          mkdir ../bin
          ext=; [ "$RUNNER_OS" = Windows ] && ext=.exe
          for prog in jitllm jitllmd jitllm-desktop jitllm-tui; do
            # The archive, not the dmg beside jitllm's own on macOS.
            archive=
            for f in ./"$prog"_*_"${{ matrix.target }}".tar.gz ./"$prog"_*_"${{ matrix.target }}".zip; do
              [ -e "$f" ] && archive=$f
            done
            test -n "$archive"
            grep " ${archive#./}\$" checksums.txt > want.txt
            if command -v sha256sum >/dev/null; then sha256sum -c want.txt; else shasum -a 256 -c want.txt; fi
            case "$archive" in
            *.zip) unzip -q -o "$archive" -d ../bin ;;
            *) tar -xzf "$archive" -C ../bin ;;
            esac
            test -x "../bin/$prog$ext"
          done
          ls -l ../bin
      - name: signature (macos)
        if: runner.os == 'macOS'
        run: |
          for prog in jitllm jitllmd jitllm-desktop jitllm-tui; do
            codesign -dv --verbose=2 "bin/$prog" 2>&1
            codesign -d --entitlements - "bin/$prog" 2>&1 || true
          done
          # The bundle macos-app signed: its signature must verify whole.
          codesign --verify --strict --verbose=2 bin/jitllm.app
          codesign -d --entitlements - bin/jitllm.app 2>&1
      # The desktop app is linked -H=windowsgui so Explorer opens no console
      # beside it: the PE optional header's Subsystem field must read 2 (GUI),
      # and every other program's 3 (console).
      - name: subsystem (windows)
        if: runner.os == 'Windows'
        run: |
          python - <<'PY'
          import struct
          def subsystem(p):
              b = open(p, 'rb').read()
              pe = struct.unpack_from('<I', b, 0x3c)[0]
              return struct.unpack_from('<H', b, pe + 24 + 68)[0]
          for prog, want in [('jitllm-desktop', 2), ('jitllm', 3), ('jitllmd', 3), ('jitllm-tui', 3)]:
              got = subsystem(f'bin/{prog}.exe')
              print(prog, got)
              assert got == want, f'{prog}.exe subsystem {got}, want {want}'
          PY
      # The dmg as a person opens it: its checksum, its signature, and the
      # app's CLI run from inside the mounted image.
      - name: dmg (macos)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cd dist
          dmg=$(ls jitllm_*_"${{ matrix.target }}".dmg)
          grep " $dmg\$" checksums.txt | shasum -a 256 -c
          hdiutil verify "$dmg"
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          test -L "$mnt/Applications"
          codesign --verify --strict --deep --verbose=2 "$mnt/jitllm.app"
          "$mnt/jitllm.app/Contents/Resources/bin/jitllm" version
          test -x "$mnt/jitllm.app/Contents/Resources/bin/jitllmd"
          hdiutil detach "$mnt"
      # The zipped bundle: its checksum, unpacked by ditto as Finder does,
      # its signature whole, and the programs inside it run.
      - name: app zip (macos)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cd dist
          appzip=$(ls jitllm_*_"${{ matrix.target }}".app.zip)
          grep " $appzip\$" checksums.txt | shasum -a 256 -c
          out=$(mktemp -d)
          ditto -x -k "$appzip" "$out"
          codesign --verify --strict --deep --verbose=2 "$out/jitllm.app"
          "$out/jitllm.app/Contents/Resources/bin/jitllm" version
          "$out/jitllm.app/Contents/MacOS/jitllm-desktop" -version
      # The portable desktop app: its checksum, a GUI program (subsystem 2),
      # and -version answering with the release's version without a window.
      - name: portable (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.target }}'.Split('_')[1]
          $exe = Get-ChildItem "dist/jitllm-desktop_*_windows_$arch.exe" | Select-Object -First 1
          $want = (Select-String -Path dist/checksums.txt -Pattern (" " + $exe.Name + "$")).Line.Split(' ')[0]
          if ((Get-FileHash -Algorithm SHA256 $exe.FullName).Hash -ne $want.ToUpper()) { throw "$($exe.Name) does not match its checksum" }
          $p = Start-Process -Wait -PassThru -NoNewWindow -FilePath $exe.FullName -ArgumentList '-version' -RedirectStandardOutput portable.txt
          $out = Get-Content portable.txt -Raw
          Write-Output $out
          if ($p.ExitCode -ne 0) { throw "$($exe.Name) -version exited $($p.ExitCode)" }
          $ver = $exe.Name.Split('_')[1]
          if ($out -notmatch [regex]::Escape("jitllm-desktop $ver")) { throw "$($exe.Name) -version did not print $ver" }
      # The setup as winget runs it: silent, per user. Then what it left --
      # the programs, the user PATH entry, the Add/Remove Programs entry --
      # and the silent uninstall taking all of it away again.
      - name: setup (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.target }}'.Split('_')[1]
          $setup = Get-ChildItem "dist/jitllm-setup_*_windows_$arch.exe" | Select-Object -First 1
          $want = (Select-String -Path dist/checksums.txt -Pattern (" " + $setup.Name + "$")).Line.Split(' ')[0]
          if ((Get-FileHash -Algorithm SHA256 $setup.FullName).Hash -ne $want.ToUpper()) { throw "$($setup.Name) does not match its checksum" }
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\jitllm'
          foreach ($p in 'jitllm.exe', 'jitllmd.exe', 'jitllm-desktop.exe', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $p))) { throw "$p was not installed" }
          }
          & (Join-Path $dir 'jitllm.exe') version
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $dir) { throw "$dir is not on the user PATH" }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\jitllm'
          Get-ItemProperty $key | Select-Object DisplayName, DisplayVersion, QuietUninstallString | Format-List
          Start-Process -Wait -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S'
          # The uninstaller copies itself to a temporary file and returns
          # before that copy has finished; give it a moment.
          for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $dir 'jitllm.exe')); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $dir 'jitllm.exe')) { throw "the uninstaller left jitllm.exe" }
          if (Test-Path $key) { throw "the uninstaller left the Add/Remove Programs entry" }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $dir) { throw "the uninstaller left $dir on the user PATH" }
      - name: hardware
        run: bin/jitllm hardware
      - uses: actions/cache@v6
        with:
          # The GGUF only: a container is tied to the converter that wrote it.
          path: ${{ env.MODELS }}/SmolLM2-360M-Instruct-Q8_0.gguf
          key: smoke-SmolLM2-360M-Instruct-Q8_0.gguf
      - name: convert and decode
        run: |
          set -euo pipefail
          mkdir -p "$MODELS"
          rm -f "${MODELS:?}"/*.jlm
          bin/jitllm convert -o "$MODELS" smollm2-360m-instruct
          bin/jitllm run -devices cpu -n 8 "$MODELS/SmolLM2-360M-Instruct-Q8_0.jlm" \
            "The capital of France is" > out.txt 2> err.txt || { cat out.txt err.txt; exit 1; }
          cat out.txt
          grep '^ids ' err.txt
          grep -q 'Paris' out.txt || { echo "::error::decode did not answer Paris"; exit 1; }

  # The winget manifests for these setups, validated, installed with winget,
  # run and uninstalled on both Windows hosts (winget.yml).
  winget:
    needs: windows-setup
    permissions:
      contents: read
    uses: ./.github/workflows/winget.yml
    with:
      release: true

  publish:
    needs: [smoke, winget]
    if: ${{ !contains(github.ref_name, '-draft') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write # move the image's latest tag
    steps:
      - name: publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
      # goreleaser pushed the image under its version only; `latest` moves to
      # it once the archives passed, and never to a prerelease (a tag with a
      # semver suffix, which is what goreleaser's prerelease: auto reads).
      - uses: docker/login-action@v4
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag the image latest
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          image=ghcr.io/jitllm/jitllm
          docker buildx imagetools create -t "$image:latest" "$image:${GITHUB_REF_NAME#v}"

  # The package-manager files for the published release, generated from its
  # checksums.txt: the Homebrew cask and formula (packaging/homebrew) and the
  # winget manifests (packaging/winget), kept as the `packaging` artifact.
  # With HOMEBREW_TAP_TOKEN set (a token that can push to jitllm/homebrew-tap)
  # the cask and formula are committed to the tap, which is what makes
  # `brew install --cask jitllm/tap/jitllm` install this release; without it
  # nothing leaves the run. The winget manifests are never submitted from
  # here: a pull request to microsoft/winget-pkgs is a separate step
  # (packaging/README.md).
  packages:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      HAS_TAP: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      JITLLM_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: generate
        run: |
          set -euo pipefail
          packaging/homebrew/generate.sh "$GITHUB_REF_NAME" dist/checksums.txt out/homebrew-tap
          packaging/winget/generate.sh "$GITHUB_REF_NAME" dist/checksums.txt out/winget
      - uses: actions/upload-artifact@v7
        with:
          name: packaging
          path: out
          retention-days: 30
      - name: update the tap
        if: env.HAS_TAP == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'jitllm/homebrew-tap' }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks tap/Formula
          cp out/homebrew-tap/Casks/jitllm.rb tap/Casks/
          cp out/homebrew-tap/Formula/jitllm.rb tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/jitllm.rb Formula/jitllm.rb
          if git diff --cached --quiet; then echo "the tap already has $GITHUB_REF_NAME"; exit 0; fi
          git commit -m "jitllm ${GITHUB_REF_NAME#v}"
          git push origin HEAD
